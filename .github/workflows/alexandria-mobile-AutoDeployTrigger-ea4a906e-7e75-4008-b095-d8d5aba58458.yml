name: Trigger auto deployment for alexandria-mobile

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ main ]
    paths:
    - '**'
    - '.github/workflows/alexandria-mobile-AutoDeployTrigger-ea4a906e-7e75-4008-b095-d8d5aba58458.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.ALEXANDRIAMOBILE_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.ALEXANDRIAMOBILE_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.ALEXANDRIAMOBILE_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          _dockerfilePathKey_: _dockerfilePath_
          _targetLabelKey_: _targetLabel_
          registryUrl: crsicfvetf5qvmk.azurecr.io
          registryUsername: ${{ secrets.ALEXANDRIAMOBILE_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.ALEXANDRIAMOBILE_REGISTRY_PASSWORD }}
          containerAppName: alexandria-mobile
          resourceGroup: rg-alexandria
          imageToBuild: crsicfvetf5qvmk.azurecr.io/alexandria-mobile:${{ github.sha }}
          _buildArgumentsKey_: |
            _buildArgumentsValues_


